name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          echo "==== ERRORES ===="
          grep -E "^e: |error:|What went wrong" -A3 build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: yumemi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
