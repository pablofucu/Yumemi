name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          echo "==== ERRORES ===="
          grep -E "^e: |error:|What went wrong" -A3 build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: yumemi-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en la release "ultima"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk yumemi.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima yumemi.apk --title "Yumemi (última versión)" --notes "APK de depuración compilado desde ${GITHUB_SHA::7}." --prerelease
