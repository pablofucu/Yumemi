name: Capturas de pantalla

on:
  push:
    paths:
      - 'app/src/**'
      - 'gradle/**'
      - '**.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Generar capturas (Robolectric + Roborazzi)
        run: |
          chmod +x ./gradlew
          ./gradlew recordRoborazziDebug --tests '*ScreenshotTest*' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yumemi-capturas
          path: app/build/outputs/roborazzi/*.png

      # Fuera de main, guarda las capturas en docs/capturas de la propia rama.
      - name: Guardar capturas en la rama
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p docs/capturas
          cp app/build/outputs/roborazzi/*.png docs/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git diff --cached --quiet || (git commit -m "Actualizar capturas de pantalla" && git push)
