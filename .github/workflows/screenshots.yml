name: Capturas de pantalla

on:
  push:
    paths:
      - 'app/src/**'
      - 'gradle/**'
      - '**.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Generar capturas (Robolectric + Roborazzi)
        run: |
          chmod +x ./gradlew
          ./gradlew recordRoborazziDebug --tests '*ScreenshotTest*' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yumemi-capturas
          path: app/build/outputs/roborazzi/*.png
